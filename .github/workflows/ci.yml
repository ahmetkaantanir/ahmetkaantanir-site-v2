name: Log Intelligence Lab CI
on:
  push:
    branches: [main, log-intelligence-lab-upgrade-2026]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Compile and test
        env:
          LOG_LAB_DB_PATH: /tmp/log-lab-ci.db
          LOG_LAB_API_KEY: ci-secret-long-enough-for-automated-tests
        run: |
          python -m compileall -q app.py log_engine.py soc_api.py soc_engine.py
          python -m pytest -q
      - name: Check JavaScript syntax
        run: |
          node --check script.js
          node --check soc.js
          node --check functions/_middleware.js
          node --test tests/pages_gate.test.mjs
