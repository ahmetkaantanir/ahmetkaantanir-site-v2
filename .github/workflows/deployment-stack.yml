name: Deployment stack verification
on:
  push:
    branches: [main]
    paths: ["Dockerfile", ".dockerignore", "deploy/**", "collectors/**", ".github/workflows/deployment-stack.yml"]
  pull_request:
    paths: ["Dockerfile", ".dockerignore", "deploy/**", "collectors/**", ".github/workflows/deployment-stack.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stack:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LOG_LAB_API_KEY: isolated-ci-owner-key-longer-than-24-characters
      LAB_COLLECTOR_KEY: isolated-ci-collector-key-longer-than-24-characters
      GRAFANA_ADMIN_PASSWORD: isolated-ci-grafana-password-longer-than-24
    steps:
      - uses: actions/checkout@v4
      - name: Prepare empty source files
        run: |
          mkdir -p deploy/logs
          touch deploy/logs/auth.log deploy/logs/security.jsonl
      - name: Validate and start real services
        run: |
          docker compose -f deploy/compose.yaml config --quiet
          docker compose -f deploy/compose.yaml up -d --build --wait --wait-timeout 180
      - name: Verify authenticated SOC, collector and Loki ingestion
        run: |
          python - <<'PY'
          import json, os, time, urllib.request
          def get(url, key=None):
              headers={'X-API-Key':key} if key else {}
              with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=10) as r:
                  return json.load(r)
          assert get('http://127.0.0.1:5000/api/health')['status']=='ok'
          with open('deploy/logs/security.jsonl','a') as f:
              f.write(json.dumps({'timestamp':'2026-11-01T12:00:00Z','EventID':1102,'hostname':'deployment-ci-host'})+'\n')
          for attempt in range(30):
              try:
                  soc=get('http://127.0.0.1:5000/api/soc/summary',os.environ['LOG_LAB_API_KEY'])
                  loki=get('http://127.0.0.1:3100/loki/api/v1/query_range?query=%7Bjob%3D%22security%22%7D&limit=10')
                  grafana=get('http://127.0.0.1:3000/api/health')
                  if soc['events']==1 and loki['data']['result'] and grafana['database']=='ok':
                      assert soc['alerts']==1
                      print('Real stack passed: SOC auth, durable collector, Loki/Alloy ingestion and Grafana database.')
                      break
              except Exception:
                  pass
              time.sleep(3)
          else:
              raise RuntimeError('Stack did not receive the expected source record')
          PY
      - name: Service status and logs
        if: always()
        run: |
          docker compose -f deploy/compose.yaml ps
          docker compose -f deploy/compose.yaml logs --tail=60
      - name: Stop isolated services
        if: always()
        run: docker compose -f deploy/compose.yaml down
