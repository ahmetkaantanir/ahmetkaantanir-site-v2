name: Live SOC Browser E2E
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tests/live-browser.mjs
      - .github/workflows/live-browser.yml
      - soc.html
      - soc.js
permissions:
  contents: read

jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser runner
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test live SOC UI in Chromium
        run: node tests/live-browser.mjs
