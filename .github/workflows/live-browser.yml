name: Live SOC Browser E2E
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tests/live-browser.mjs
      - .github/workflows/live-browser.yml
      - soc.html
      - index.html
      - workspace-embed.js
      - ui.js
      - ui.css
      - translations.js
      - geo.js
      - vendor/world-land.geojson
      - tests/geo.test.mjs
      - tests/atlas-browser.mjs
      - tests/ui-browser.mjs
      - style.css
      - soc.js
      - platform-ui.js
      - tests/platform-browser.mjs
      - integrations/**
      - collectors/**
      - platform_auth.py
      - atlas.js
      - soc.css
      - vendor/maplibre/**
      - functions/_middleware.js
permissions:
  contents: read

jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser runner
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test live SOC UI in Chromium
        run: node tests/live-browser.mjs
  local-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: |
          python -m pip install -r requirements.txt
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start isolated application
        env:
          LOG_LAB_DB_PATH: /tmp/log-lab-ui.db
          LOG_LAB_API_KEY: isolated-browser-test-key-at-least-32-characters
        run: |
          python -m flask --app app run --host 127.0.0.1 --port 5056 > /tmp/log-lab-ui.log 2>&1 &
          for i in {1..30}; do
            if curl --silent --fail http://127.0.0.1:5056/api/health; then exit 0; fi
            sleep 1
          done
          cat /tmp/log-lab-ui.log
          exit 1
      - name: Test analysis, reports, languages, themes and responsive layouts
        env:
          SOC_TEST_KEY: isolated-browser-test-key-at-least-32-characters
        run: |
          node tests/ui-browser.mjs
          node tests/atlas-browser.mjs
          node tests/platform-browser.mjs
