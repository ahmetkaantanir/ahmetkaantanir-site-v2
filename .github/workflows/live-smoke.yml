name: Live Site Verification
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify live content and public security controls
        shell: bash
        run: |
          set -euo pipefail
          HOST="https://dev.ahmetkaantanir.com"
          get_status() {
            curl --silent --show-error --location --retry 1 --max-time 25 --output /tmp/live-response --write-out '%{http_code}' "$HOST$1"
          }
          for PATHNAME in / /soc /api/health /soc.css /soc.js; do
            CODE=$(get_status "$PATHNAME") || CODE="000"
            echo "PUBLIC $PATHNAME HTTP $CODE"
            if [ "$CODE" != "200" ]; then
              echo "::error::Live $PATHNAME unavailable HTTP $CODE"
              exit 1
            fi
            if [ "$PATHNAME" = "/soc" ] && ! grep -qi 'SOC Workspace' /tmp/live-response; then
              echo "::error::New SOC V5 page marker missing"
              exit 1
            fi
          done
          for PATHNAME in /app.py /log_engine.py /soc_engine.py /soc_api.py /analysis.db /.env /datasets/mixed.log; do
            CODE=$(get_status "$PATHNAME") || CODE="000"
            echo "PRIVATE $PATHNAME HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              TYPE=$(file --brief --mime-type /tmp/live-response || true)
              printf 'BODY MIME: %s, BYTES: %s, HTML: %s, PYTHON_SOURCE: %s\n' "$TYPE" "$(wc -c < /tmp/live-response)" "$(grep -Eiq '<!doctype html|<html' /tmp/live-response && echo yes || echo no)" "$(grep -Eiq '^from flask import|^import json|^import os
              echo "::error::Sensitive $PATHNAME not safely blocked (HTTP $CODE)"
              exit 1
            fi
          done
          CODE=$(get_status "/api/soc/summary") || CODE="000"
          echo "PROTECTED SOC API HTTP $CODE (401 means configured, 503 means missing secret)"
          if [ "$CODE" = "503" ]; then
            echo "::warning::LOG_LAB_API_KEY has not been configured on the live Render service: SOC private API is disabled"
          elif [ "$CODE" != "401" ]; then
            echo "::error::SOC API should be 401 or 503 without valid API key, found $CODE"
            exit 1
          fi
          echo "Live smoke and asset/security checks completed."
 /tmp/live-response && echo yes || echo no)"
            fi
            if [ "$CODE" != "404" ]; then
              echo "::error::Sensitive $PATHNAME not safely blocked (HTTP $CODE)"
              exit 1
            fi
          done
          CODE=$(get_status "/api/soc/summary") || CODE="000"
          echo "PROTECTED SOC API HTTP $CODE (401 means configured, 503 means missing secret)"
          if [ "$CODE" = "503" ]; then
            echo "::warning::LOG_LAB_API_KEY has not been configured on the live Render service: SOC private API is disabled"
          elif [ "$CODE" != "401" ]; then
            echo "::error::SOC API should be 401 or 503 without valid API key, found $CODE"
            exit 1
          fi
          echo "Live smoke and asset/security checks completed."
