name: Live Site Verification
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify live content and public security controls
        shell: bash
        run: |
          set -euo pipefail
          HOST="https://dev.ahmetkaantanir.com"
          get_status() {
            curl --silent --show-error --location --retry 1 --max-time 25 --output /tmp/live-response --write-out '%{http_code}' "$HOST$1"
          }
          for PATHNAME in / /soc /api/health /soc.css /soc.js; do
            CODE=$(get_status "$PATHNAME") || CODE="000"
            echo "PUBLIC $PATHNAME HTTP $CODE"
            if [ "$CODE" != "200" ]; then
              echo "::error::Live $PATHNAME unavailable HTTP $CODE"
              exit 1
            fi
            if [ "$PATHNAME" = "/soc" ] && ! grep -qi 'SOC Workspace' /tmp/live-response; then
              echo "::error::SOC V5 marker missing"
              exit 1
            fi
          done
          for PATHNAME in /app.py /log_engine.py /soc_engine.py /soc_api.py /analysis.db /.env /datasets/mixed.log; do
            CODE=$(get_status "$PATHNAME") || CODE="000"
            echo "PRIVATE $PATHNAME HTTP $CODE"
            if [ "$CODE" != "404" ]; then
              TYPE=$(file --brief --mime-type /tmp/live-response || true)
              if grep -Eiq '<!doctype html|<html' /tmp/live-response; then HTML=yes; else HTML=no; fi
              if grep -Eiq '^from flask import|^import json|^import os$' /tmp/live-response; then PYTHON_SOURCE=yes; else PYTHON_SOURCE=no; fi
              echo "DIAGNOSTIC content_type=$TYPE bytes=$(wc -c < /tmp/live-response) html=$HTML python_source=$PYTHON_SOURCE"
              echo "::error::Sensitive $PATHNAME not safely blocked (HTTP $CODE)"
              exit 1
            fi
          done
          CODE=$(get_status "/api/soc/summary") || CODE="000"
          echo "PROTECTED SOC API HTTP $CODE (401 configured; 503 missing secret)"
          if [ "$CODE" = "503" ]; then
            echo "::warning::LOG_LAB_API_KEY is missing on the live service"
          elif [ "$CODE" != "401" ]; then
            echo "::error::Unexpected public SOC API status $CODE"
            exit 1
          fi
          echo "Live smoke and security checks completed."
