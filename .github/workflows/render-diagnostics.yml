name: Verify Render Backend Host
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check Flask origin health, SOC and source blocking
        shell: bash
        run: |
          set -uo pipefail
          HOST="https://ahmetkaantanir-site-v2.onrender.com"
          for PATHNAME in /api/health /soc /soc.js /app.py /soc_api.py /api/soc/summary; do
            CODE=$(curl --silent --show-error --max-time 50 --output /tmp/render-body --write-out '%{http_code}' "$HOST$PATHNAME") || CODE="000"
            JSON=no
            if grep -q '"service"' /tmp/render-body; then JSON=yes; fi
            MARKER=no
            if grep -q 'SOC Workspace' /tmp/render-body; then MARKER=yes; fi
            echo "RENDER $PATHNAME status=$CODE json_service=$JSON soc_marker=$MARKER size=$(wc -c < /tmp/render-body)"
          done
