name: log-intelligence-lab
services:
  api:
    build:
      context: ..
      dockerfile: Dockerfile
    ports: ["127.0.0.1:5000:5000"]
    environment:
      LOG_LAB_API_KEY: ${LOG_LAB_API_KEY:?Run deploy/setup.ps1 first}
      LOG_LAB_PRINCIPALS: '[{"name":"file-collector","role":"collector","key":"${LAB_COLLECTOR_KEY:?Run deploy/setup.ps1 first}"}]'
      LOG_LAB_DB_PATH: /data/analysis.db
      LAB_LOKI_URL: http://loki:3100
      LAB_LOKI_TOKEN: ${LAB_LOKI_TOKEN:-}
      LAB_LOKI_USER: ${LAB_LOKI_USER:-}
      LAB_LOKI_PASSWORD: ${LAB_LOKI_PASSWORD:-}
      LAB_GRAFANA_URL: http://grafana:3000
      LAB_GRAFANA_PUBLIC_URL: ${LAB_GRAFANA_PUBLIC_URL:-http://127.0.0.1:3000}
      LAB_ALLOW_PRIVATE_HTTP: "true"
      LAB_GNS3_URL: ${LAB_GNS3_URL:-}
      LAB_GNS3_USER: ${LAB_GNS3_USER:-}
      LAB_GNS3_PASSWORD: ${LAB_GNS3_PASSWORD:-}
      LAB_WAZUH_URL: ${LAB_WAZUH_URL:-}
      LAB_WAZUH_TOKEN: ${LAB_WAZUH_TOKEN:-}
      LAB_WAZUH_USER: ${LAB_WAZUH_USER:-}
      LAB_WAZUH_PASSWORD: ${LAB_WAZUH_PASSWORD:-}
      LAB_WAZUH_CA_FILE: ${LAB_WAZUH_CA_FILE:-}
      LAB_LOKI_CF_ACCESS_CLIENT_ID: ${LAB_LOKI_CF_ACCESS_CLIENT_ID:-}
      LAB_LOKI_CF_ACCESS_CLIENT_SECRET: ${LAB_LOKI_CF_ACCESS_CLIENT_SECRET:-}
      LAB_GRAFANA_CF_ACCESS_CLIENT_ID: ${LAB_GRAFANA_CF_ACCESS_CLIENT_ID:-}
      LAB_GRAFANA_CF_ACCESS_CLIENT_SECRET: ${LAB_GRAFANA_CF_ACCESS_CLIENT_SECRET:-}
      LAB_GNS3_CF_ACCESS_CLIENT_ID: ${LAB_GNS3_CF_ACCESS_CLIENT_ID:-}
      LAB_GNS3_CF_ACCESS_CLIENT_SECRET: ${LAB_GNS3_CF_ACCESS_CLIENT_SECRET:-}
      LAB_WAZUH_CF_ACCESS_CLIENT_ID: ${LAB_WAZUH_CF_ACCESS_CLIENT_ID:-}
      LAB_WAZUH_CF_ACCESS_CLIENT_SECRET: ${LAB_WAZUH_CF_ACCESS_CLIENT_SECRET:-}
      LAB_OLLAMA_URL: ${LAB_OLLAMA_URL:-}
      LAB_OLLAMA_MODEL: ${LAB_OLLAMA_MODEL:-}
      LAB_OLLAMA_TOKEN: ${LAB_OLLAMA_TOKEN:-}
      LAB_ABUSEIPDB_KEY: ${LAB_ABUSEIPDB_KEY:-}
      LAB_VIRUSTOTAL_KEY: ${LAB_VIRUSTOTAL_KEY:-}
      LAB_INTELLIGENCE_FEED: ${LAB_INTELLIGENCE_FEED:-}
      LAB_GEOIP_FEED: ${LAB_GEOIP_FEED:-}
    volumes:
      - soc-data:/data
      - ./feeds:/feeds:ro
    depends_on: [loki]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  collector:
    build:
      context: ..
      dockerfile: Dockerfile
    command: ["python", "-m", "collectors.file_forwarder", "--file", "/logs/security.jsonl", "--file", "/logs/auth.log", "--state", "/data/collector.db"]
    environment:
      LAB_SOC_URL: http://api:5000
      LAB_COLLECTOR_KEY: ${LAB_COLLECTOR_KEY:?Run deploy/setup.ps1 first}
      LAB_ALLOW_PRIVATE_HTTP: "true"
    volumes:
      - ./logs:/logs:ro
      - collector-data:/data
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
  loki:
    image: grafana/loki:3.5.7
    command: -config.file=/etc/loki/config.yaml
    ports: ["127.0.0.1:3100:3100"]
    volumes:
      - ./loki.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    restart: unless-stopped
  alloy:
    image: grafana/alloy:v1.10.2
    command: ["run", "--storage.path=/var/lib/alloy", "/etc/alloy/config.alloy"]
    volumes:
      - ./config.alloy:/etc/alloy/config.alloy:ro
      - ./logs:/var/log/lab:ro
      - alloy-data:/var/lib/alloy
    depends_on: [loki]
    restart: unless-stopped
  grafana:
    image: grafana/grafana:12.2.1
    ports: ["127.0.0.1:3000:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [loki]
    restart: unless-stopped
  prometheus:
    image: prom/prometheus:v3.7.1
    ports: ["127.0.0.1:9090:9090"]
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d"]
    restart: unless-stopped
  node-exporter:
    image: prom/node-exporter:v1.9.1
    command: ["--path.rootfs=/host", "--path.procfs=/host/proc", "--path.sysfs=/host/sys"]
    volumes:
      - /:/host:ro,rslave
    restart: unless-stopped
volumes:
  soc-data:
  collector-data:
  loki-data:
  grafana-data:
  alloy-data:
  prometheus-data:
